name: Verify immutable workflow dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'config/numina-runners.json'
      - 'scripts/check-runner-policy.mjs'
      - 'action-pins.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/numina-runners.json'
      - 'scripts/check-runner-policy.mjs'
      - 'action-pins.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce NUMINA runner policy
        run: node scripts/check-runner-policy.mjs

      - name: Require immutable action and reviewed critical-workflow pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          workflow_dir = Path('.github/workflows')
          sha_ref = re.compile(r'^.+@[0-9a-fA-F]{40}$')
          uses_line = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')
          approved = {
              item['repository']: item['sha'].lower()
              for item in json.loads(Path('action-pins.json').read_text(encoding='utf-8'))['actions']
          }
          failures = []
          checked = []

          for path in sorted(workflow_dir.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              critical = (
                  'secrets.' in text
                  or re.search(r'^\s*pull_request:', text, re.MULTILINE)
                  or re.search(r'^\s+(?:id-token|attestations):\s*write\s*$', text, re.MULTILINE)
              )
              for line_number, line in enumerate(text.splitlines(), start=1):
                  match = uses_line.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip('"\'')
                  if reference.startswith('./'):
                      continue
                  checked.append((str(path), line_number, reference))
                  if not sha_ref.fullmatch(reference):
                      failures.append((str(path), line_number, reference, 'mutable reference'))
                      continue
                  repository, sha = reference.rsplit('@', 1)
                  if critical and repository in approved and sha.lower() != approved[repository]:
                      failures.append((str(path), line_number, reference, 'not the reviewed canonical pin'))

          if failures:
              for path, line_number, reference, reason in failures:
                  print(f'WORKFLOW_PIN_FAILURE {path}:{line_number}: {reference} ({reason})')
              raise SystemExit(f'{len(failures)} workflow dependency pin violation(s) found')

          print(f'Validated {len(checked)} immutable references and canonical pins on critical workflows.')
          PY
