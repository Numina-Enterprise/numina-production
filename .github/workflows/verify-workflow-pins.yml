name: Verify immutable workflow dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/deploy-production.trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable action and reusable-workflow references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_dir = Path('.github/workflows')
          sha_ref = re.compile(r'^.+@[0-9a-fA-F]{40}$')
          uses_line = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')
          failures = []
          checked = []

          for path in sorted(workflow_dir.glob('*.y*ml')):
              for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  runner = runs_on_line.match(line)
                  if runner:
                      value = runner.group(1).strip().strip('"\\\'')
                      runner_checks.append((str(path), line_number, value))
                      normalized = value.lower()
                      if 'self-hosted' in normalized:
                          failures.append((str(path), line_number, 'SELF_HOSTED_RUNNER_DENIED: ' + value))
                      elif value not in allowed_hosted and not value.startswith('${{'):
                          failures.append((str(path), line_number, 'UNAPPROVED_RUNNER_LABEL: ' + value))

                  match = uses_line.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip('"\'')
                  if reference.startswith('./'):
                      continue
                  checked.append((str(path), line_number, reference))
                  if not sha_ref.fullmatch(reference):
                      failures.append((str(path), line_number, reference))

          if failures:
              for path, line_number, reference in failures:
                  print(f'POLICY_VIOLATION {path}:{line_number}: {reference}')
              raise SystemExit(f'{len(failures)} workflow policy violation(s) found')

          print(f'Validated {len(checked)} immutable external workflow dependency reference(s).')
          print(f'Validated {len(runner_checks)} GitHub-hosted runner declaration(s); self-hosted runners are denied.')
          PY


  prebuilt-production-deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_8bJOKLq941ouBmsFMEXAERfD
      VERCEL_PROJECT_ID: prj_WY1kKgo522ufsymotnArIUee01uO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned setup-node commit
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate production build
        run: npm run build
      - name: Install scoped NUSD development dependencies
        run: npm ci --prefix runtime/nusd/development

      - name: Validate NUMINA
        run: npm test
      - name: Require Vercel deployment credential
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN repository secret is not configured"; exit 2; }
      - name: Install pinned deployment CLI major
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact on GitHub
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
