name: Verify immutable workflow dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require immutable action and reusable-workflow references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_dir = Path('.github/workflows')
          sha_ref = re.compile(r'^.+@[0-9a-fA-F]{40}$')
          uses_line = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')
          failures = []
          checked = []

          for path in sorted(workflow_dir.glob('*.y*ml')):
              for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  match = uses_line.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip('"\'')
                  if reference.startswith('./'):
                      continue
                  checked.append((str(path), line_number, reference))
                  if not sha_ref.fullmatch(reference):
                      failures.append((str(path), line_number, reference))

          if failures:
              for path, line_number, reference in failures:
                  print(f'UNPINNED {path}:{line_number}: {reference}')
              raise SystemExit(f'{len(failures)} mutable workflow dependency reference(s) found')

          print(f'Validated {len(checked)} immutable external workflow dependency reference(s).')
          PY


  prebuilt-production-deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_8bJOKLq941ouBmsFMEXAERfD
      VERCEL_PROJECT_ID: prj_WY1kKgo522ufsymotnArIUee01uO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require Vercel deployment credential
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN repository secret is not configured"; exit 2; }
      - name: Install dependencies
        run: npm ci
      - name: Validate NUMINA
        run: npm test
      - name: Install pinned deployment CLI major
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact on GitHub
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Report successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --title "NUMINA prebuilt deploy succeeded" --body "Commit: $GITHUB_SHA

Production deployment: $DEPLOY_URL

The existing immutable-workflow verifier built Numina on GitHub-hosted compute and submitted the prebuilt production artifact to Vercel."
      - name: Report deployment blocker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "NUMINA prebuilt deploy blocked" --body "Commit: $GITHUB_SHA

The deployment job in the existing immutable-workflow verifier failed. Inspect this workflow run before claiming current main is deployed."
