name: Verify immutable workflow dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'config/numina-runners.json'
      - 'scripts/check-runner-policy.mjs'
      - 'action-pins.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/numina-runners.json'
      - 'scripts/check-runner-policy.mjs'
      - 'action-pins.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce NUMINA runner policy
        run: node scripts/check-runner-policy.mjs

      - name: Require immutable action and reusable-workflow references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          workflow_dir = Path('.github/workflows')
          sha_ref = re.compile(r'^.+@[0-9a-fA-F]{40}$')
          uses_line = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)')
          pin_manifest = json.loads(Path('action-pins.json').read_text(encoding='utf-8'))
          approved_actions = {
              item['repository']: item['sha'].lower()
              for item in pin_manifest['actions']
          }
          approved_reusable = {
              item['workflow']: item['sha'].lower()
              for item in pin_manifest.get('reusable_workflows', [])
          }
          failures = []
          checked_actions = []
          checked_reusable = []
          checked_local_reusable = []

          for path in sorted(workflow_dir.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              critical = (
                  'secrets.' in text
                  or re.search(r'^\s*pull_request:', text, re.MULTILINE)
                  or re.search(r'^\s+(?:id-token|attestations):\s*write\s*$', text, re.MULTILINE)
              )
              for line_number, line in enumerate(text.splitlines(), start=1):
                  match = uses_line.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip('"\'')
                  if reference.startswith('./'):
                      if reference.startswith('./.github/workflows/'):
                          local_path = Path(reference[2:])
                          checked_local_reusable.append((str(path), line_number, reference))
                          if not local_path.is_file() or local_path.suffix not in {'.yml', '.yaml'}:
                              failures.append((str(path), line_number, reference, 'local reusable workflow path missing'))
                      continue
                  is_reusable = '/.github/workflows/' in reference.split('@', 1)[0]
                  if not sha_ref.fullmatch(reference):
                      failures.append((str(path), line_number, reference, 'mutable reusable workflow reference' if is_reusable else 'mutable action reference'))
                      continue
                  target, sha = reference.rsplit('@', 1)
                  if is_reusable:
                      checked_reusable.append((str(path), line_number, reference))
                      if target in approved_reusable and sha.lower() != approved_reusable[target]:
                          failures.append((str(path), line_number, reference, 'not the reviewed reusable-workflow pin'))
                  else:
                      checked_actions.append((str(path), line_number, reference))
                      if critical and target in approved_actions and sha.lower() != approved_actions[target]:
                          failures.append((str(path), line_number, reference, 'not the reviewed canonical action pin'))

          if failures:
              for path, line_number, reference, reason in failures:
                  print(f'WORKFLOW_PIN_FAILURE {path}:{line_number}: {reference} ({reason})')
              raise SystemExit(f'{len(failures)} workflow dependency pin violation(s) found')

          print(f'Validated {len(checked_actions)} immutable external action reference(s), {len(checked_reusable)} immutable remote reusable-workflow reference(s), and {len(checked_local_reusable)} same-commit local reusable-workflow reference(s).')
          PY
