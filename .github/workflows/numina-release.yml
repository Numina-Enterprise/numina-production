name: Numina GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numina-release.yml'
      - 'scripts/package-github-release.mjs'
      - 'scripts/publish-github-release.mjs'
      - 'scripts/build.mjs'
      - 'scripts/apply-numina-manifest-metadata.mjs'
      - 'config/numina-routing.json'
      - 'scripts/build-trusted-source-release.mjs'
      - 'runtime/nusd/scripts/prepare-post-freeze-journal.mjs'
      - 'scripts/check-final-build.mjs'
      - 'package.json'
      - 'public/final-build.json'
      - 'src/**'
      - 'runtime/vercel-production/**'
      - 'public/**'
permissions:
  contents: write
concurrency:
  group: numina-github-release-v4
  cancel-in-progress: true
jobs:
  publish:
    name: NUMINA GitHub Release
    runs-on: ubuntu-24.04 # substrate only; release identity remains NUMINA
    timeout-minutes: 30
    steps:
      - name: NUMINA repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: NUMINA runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: NUMINA pinned dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: NUMINA build
        run: npm run build
      - name: NUMINA exact artifact pins
        run: node scripts/sync-application-release-pin.mjs
      - name: Package canonical NUMINA release
        run: npm run release:numina
      - name: Publish canonical GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.mjs
