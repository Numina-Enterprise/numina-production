name: Numina production release candidate
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: numina-production-release
  cancel-in-progress: false
jobs:
  build-and-attest:
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Immutable reviewed Numina builder.
    uses: skott34-dot/numina-builder/.github/workflows/numina-site-builder.yml@0cfa7fe33400405cb83311734354873d069c4389
    # No secrets: inherit. No inputs. No production deployment is authorized by
    # a successful build alone; the independent verification policy must pass.
