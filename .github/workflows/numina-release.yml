name: Numina GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/numina-release.yml'
      - 'scripts/package-github-release.mjs'
      - 'scripts/publish-github-release.mjs'
      - 'scripts/build.mjs'
      - 'scripts/check-final-build.mjs'
      - 'package.json'
      - 'public/final-build.json'
      - 'src/**'
      - 'runtime/vercel-production/**'
      - 'public/**'
      - 'config/**'
      - 'tests/**'
      - 'docs/nusd/**'
      - 'release-evidence/treasury-*.json'
permissions:
  contents: write
concurrency:
  group: numina-github-release-v4
  cancel-in-progress: false
jobs:
  publish:
    name: NUMINA GitHub Release
    runs-on: NUMINA
    timeout-minutes: 30
    steps:
      - name: NUMINA repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: NUMINA runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: NUMINA pinned test dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: NUMINA build
        run: npm run build
      - name: NUMINA suite
        run: npm test
      - name: Package canonical NUMINA release
        run: npm run release:numina
      - name: Publish canonical GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.mjs
