name: Verify provider observations

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verify-provider-observations
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      NUMINA_PROVIDER_EVIDENCE_PATH: provider-evidence/provider-observation-${{ github.run_id }}-${{ github.run_attempt }}.json
      NUMINA_PROVIDER_RECORD_PATH: provider-evidence/native-evidence-record-${{ github.run_id }}-${{ github.run_attempt }}.json
      NUMINA_TRUSTED_RELEASE_PATH: provider-evidence/trusted-source-release-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify Circle and Arc read-only observation contracts
        run: node --test tests/provider-observations.test.mjs
      - name: Verify governed Arc provider submitter contract
        run: node --test tests/provider-submitter.test.mjs
      - name: Observe current providers from GitHub-bound source
        env:
          NUMINA_EXPECTED_GIT_SHA: ${{ github.sha }}
        run: node scripts/smoke-provider-observations.mjs
      - name: Archive provider evidence
        id: archive
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numina-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NUMINA_PROVIDER_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Build canonical NUMINA-native evidence record
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        env:
          NUMINA_ARCHIVE_ARTIFACT_NAME: numina-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          NUMINA_ARCHIVE_ARTIFACT_ID: ${{ steps.archive.outputs.artifact-id }}
          NUMINA_ARCHIVE_ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: node scripts/build-provider-evidence-record.mjs
      - name: Archive canonical NUMINA-native evidence record
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numina-native-evidence-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NUMINA_PROVIDER_RECORD_PATH }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish and read back canonical provider evidence from GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-evidence.mjs "$NUMINA_PROVIDER_EVIDENCE_PATH" "$NUMINA_PROVIDER_RECORD_PATH"
      - name: Verify current Numina source before trusting release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          echo "NUMINA_ROOT_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Build trusted source release gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUMINA_EXPECTED_GIT_SHA: ${{ github.sha }}
        run: node scripts/build-trusted-source-release.mjs
      - name: Archive trusted source release gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: numina-trusted-source-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NUMINA_TRUSTED_RELEASE_PATH }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish and read back trusted source release from GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-evidence.mjs "$NUMINA_TRUSTED_RELEASE_PATH"
