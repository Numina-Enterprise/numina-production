name: Verify root Vercel adapter
# NUMINA singular manifest verification

on:
  push:
    paths:
      - '.github/workflows/verify-root-vercel.yml'
      - '.nvmrc'
      - 'api/**'
      - 'package.json'
      - 'scripts/release-manifest.mjs'
      - 'docs/native-package-record-v4.json'
      - 'vercel.json'
      - 'public/runtime-contract.js'
      - 'src/**'
      - 'tests/treasury-simulation-http.test.mjs'
      - 'runtime/vercel-production/vercel.json'
      - 'runtime/vercel-production/api/**'
      - 'runtime/vercel-production/lib/**'
      - 'tests/provider-submitter.test.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Validate pinned Node runtime
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const nvmrc=readFileSync('.nvmrc','utf8').trim();
          if(pkg.engines?.node!=='24.x') throw new Error('package runtime must stay pinned to Node 24.x');
          if(nvmrc!=='24') throw new Error('.nvmrc must stay pinned to Node 24');
          if(Number(process.versions.node.split('.')[0])!==24) throw new Error('CI is not running Node 24');
          NODE
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: Validate governed Arc provider submitter
        run: node --test tests/provider-submitter.test.mjs
      - name: Validate NUSD simulation API
        run: node --test tests/treasury-simulation-http.test.mjs
      - name: Validate application build
        run: npm run build
      - name: Validate complete Numina test suite
        run: npm test
      - name: Validate root routes, release identities and provenance-bound readiness
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {createRequire} from 'node:module';
          const config=JSON.parse(readFileSync('vercel.json','utf8'));
          const deploymentPolicy=config.git?.deploymentEnabled;
          if(!deploymentPolicy||typeof deploymentPolicy!=='object'||deploymentPolicy['*']!==false||deploymentPolicy.main!==true||Object.keys(deploymentPolicy).length!==2) throw new Error('Git deployment policy must allow only main');
          const rewrites=new Map((config.rewrites||[]).map(rule=>[rule.source,rule.destination]));
          for(const source of ['/v1/frontier/readiness','/v1/deployment/provenance','/v1/status','/v1/control/state','/v1/control/evaluate','/v1/execution/providers','/v1/execution/prepare','/v1/execution/submit','/v1/execution/evidence/bind','/v1/release/manifest','/v1/release/supply-chain','/v1/release/attestation','/v2/network/status','/v2/network/deployment-estimate','/v2/release/manifest','/v3/release/manifest','/v4/release/manifest']) if(!rewrites.has(source)) throw new Error('missing Vercel route: '+source);
          // The root serves numinalabs.xyz and forwards to Sites; the standalone
          // runtime forwards to that canonical domain. Sending the root back to
          // its own domain would introduce a fallback loop.
          for(const [configPath,destination] of [
            ['vercel.json','https://personal-space-m7q9.skott34.chatgpt.site/api/nusd/v1/:path*'],
            ['runtime/vercel-production/vercel.json','https://numinalabs.xyz/api/nusd/v1/:path*']
          ]) {
            const gateway=JSON.parse(readFileSync(configPath,'utf8'));
            const matches=(gateway.rewrites||[]).filter(rule=>rule.source==='/api/nusd/v1/:path*');
            if(matches.length!==1||matches[0].destination!==destination) throw new Error('NUSD API fallback topology mismatch: '+configPath);
          }
          if(rewrites.get('/v1/frontier/readiness')!=='/api/application-release?mode=frontier-readiness') throw new Error('frontier readiness bypasses verifier');
          if(rewrites.get('/v1/deployment/provenance')!=='/api/application-release?mode=deployment-provenance') throw new Error('deployment provenance bypasses verifier');
          if(rewrites.get('/v1/execution/submit')!=='/api/execution-prepare?mode=submit') throw new Error('execution submit route bypasses governed handler');
          for(const source of ['/v2/release/manifest','/v3/release/manifest','/v4/release/manifest']) if(rewrites.get(source)!=='/api/application-release') throw new Error('application release alias bypasses validation proxy: '+source);
          const files=readdirSync('api').filter(name=>/\.(?:js|mjs)$/.test(name)).sort();
          if(files.length!==12) throw new Error('expected 12 root API adapters, found '+files.length);
          for(const file of files){const mod=await import(pathToFileURL(resolve('api',file)).href);if(typeof mod.default!=='function') throw new Error('default handler missing: '+file);}
          const {EXPECTED_RELEASE,RELEASE_ARTIFACT_TYPE}=await import(pathToFileURL(resolve('public/runtime-contract.js')).href);
          const {APPLICATION_VERSION,APPLICATION_RELEASE,EXPECTED_APPLICATION_ARTIFACT_BUILD_ID,APPLICATION_ARTIFACT_BUILD_SCOPE}=await import(pathToFileURL(resolve('src/application-release-contract.js')).href);
          const generatedApplication=JSON.parse(readFileSync('dist/client/downloads/application-release-v4.json','utf8'));
          if(generatedApplication.singular!==true||generatedApplication.identity!=='NUMINA'||generatedApplication.version!==APPLICATION_VERSION||generatedApplication.release!==APPLICATION_RELEASE) throw new Error('generated application release identity drift');
          if(generatedApplication.build_id!==EXPECTED_APPLICATION_ARTIFACT_BUILD_ID) throw new Error('generated application artifact inventory build id drift: '+generatedApplication.build_id);
          const require=createRequire(import.meta.url);
          const {RELEASE_IDENTITY}=require(resolve('runtime/vercel-production/lib/numina.js'));
          if(Object.keys(RELEASE_IDENTITY).length!==Object.keys(EXPECTED_RELEASE).length) throw new Error('runtime identity field set differs from pinned contract');
          for(const [field,expected] of Object.entries(EXPECTED_RELEASE)) if(RELEASE_IDENTITY[field]!==expected) throw new Error('runtime identity drift: '+field);
          if(JSON.stringify(RELEASE_IDENTITY).includes('rc22')) throw new Error('legacy rc22 identity survived runtime alignment');
          const {validateApplicationRelease,evaluateFrontierReadiness,validateDeploymentProvenance}=await import(pathToFileURL(resolve('api/application-release.mjs')).href);
          const application={schema:'numina.application-release.v2',schema_version:2,singular:true,identity:'NUMINA',product:'NUMINA',version:APPLICATION_VERSION,release:APPLICATION_RELEASE,build_id:EXPECTED_APPLICATION_ARTIFACT_BUILD_ID,runtime_dependency:{singular:true,identity:'NUMINA',version:EXPECTED_RELEASE.production_version,release:EXPECTED_RELEASE.release,manifest:'/v1/release/manifest',signed_declaration:'/v1/release/attestation'}};
          validateApplicationRelease(application);
          const deployment={schema:'numina.transport-observation.v1',root:'NUMINA',manifest:'NUMINA',identity:'NUMINA',authority:'NUMINA',source:'NUMINA',evidence:'NUMINA',provider:'NUMINA',host:'NUMINA',provenance:'NUMINA',provider_verification:true,deployment:'NUMINA',transport:'vercel',authoritative:false,environment:'production',deployment_id:'dpl_1234567890',host_url:'https://numinalabs.xyz',transport_url:'https://numina-production-example.vercel.app',git_commit_sha:'0123456789abcdef0123456789abcdef01234567',git_commit_ref:'main',runtime_release:EXPECTED_RELEASE.production_version,release:EXPECTED_RELEASE.release};
          if(!validateDeploymentProvenance(deployment)) throw new Error('valid deployment provenance rejected');
          const manifest={schema:'numina.manifest.v2',singular:true,root:'NUMINA',manifest:'NUMINA',identity:'NUMINA',authority:'NUMINA',source:'NUMINA',evidence:'NUMINA',provider:'NUMINA',provider_verification:true,deployment:'NUMINA',deployed:true,productionSource:'NUMINA',release:{...EXPECTED_RELEASE}};
          const supplyEvidence={valid:true,release:EXPECTED_RELEASE.release,production_files_root:EXPECTED_RELEASE.production_files_root,spdx_sbom_sha256:EXPECTED_RELEASE.spdx_sbom_sha256,slsa_provenance_sha256:EXPECTED_RELEASE.slsa_provenance_sha256};
          const records={application,manifest:{manifest,receipt:{artifact_type:'NUMINA_MANIFEST',payload:manifest}},attestation:{artifact_type:RELEASE_ARTIFACT_TYPE,payload:{...EXPECTED_RELEASE,environment:'production',role:'public-verifier'}},supply:{payload:{evidence:supplyEvidence,receipt:{artifact_type:'NUMINA_SUPPLY_CHAIN_EVIDENCE',payload:supplyEvidence}}},deployment};
          // Isolated fixture signatures exercise bindings here; provider submission
          // authorization remains covered by the dedicated test step above.
          const verifyEnvelope=(envelope,type)=>envelope?.artifact_type===type;
          const ready=evaluateFrontierReadiness(records,{verifyEnvelope});
          if(!ready.ready||!ready.checks.numina_deployment||!Object.values(ready.checks).every(value=>value===true)) throw new Error('NUMINA manifest did not establish release readiness');
          if(ready.application.artifact_inventory_build_id!==EXPECTED_APPLICATION_ARTIFACT_BUILD_ID||ready.application.artifact_inventory_scope!==APPLICATION_ARTIFACT_BUILD_SCOPE) throw new Error('frontier readiness application artifact identity drift');
          if(ready.transport.substrate_observation.verified!==true) throw new Error('valid transport observation rejected');
          const noProvenance=evaluateFrontierReadiness({...records,deployment:null},{verifyEnvelope});
          if(!noProvenance.ready||noProvenance.transport.substrate_observation.verified!==false) throw new Error('transport diagnostics incorrectly changed NUMINA release readiness');
          const unsignedManifest={...manifest,extra_claim:'unsigned'};
          const unsigned=evaluateFrontierReadiness({...records,manifest:{...records.manifest,manifest:unsignedManifest}},{verifyEnvelope});
          if(unsigned.ready||unsigned.checks.runtime_manifest_identity) throw new Error('unsigned manifest fields inherited receipt verification');
          const changedSupply=evaluateFrontierReadiness({...records,supply:{payload:{...records.supply.payload,evidence:{...supplyEvidence,spdx_sbom_sha256:'0'.repeat(64)}}}},{verifyEnvelope});
          if(changedSupply.ready||changedSupply.checks.supply_chain_identity) throw new Error('changed supply evidence inherited receipt verification');
          const wrongRelease=evaluateFrontierReadiness({...records,attestation:{...records.attestation,payload:{...records.attestation.payload,production_version:'1.9.0-rc22'}}},{verifyEnvelope});
          if(wrongRelease.ready||wrongRelease.checks.release_attestation_signature) throw new Error('wrong signed release established readiness');
          console.log('Validated main-only Git deployment policy, topology-specific NUSD routing, current application artifact inventory '+EXPECTED_APPLICATION_ARTIFACT_BUILD_ID+', 12-function topology, exact rc26 identity and signed release readiness bindings on Node '+process.versions.node+'.');
          NODE
