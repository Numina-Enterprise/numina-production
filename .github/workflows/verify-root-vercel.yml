name: Verify root Vercel adapter

on:
  push:
    paths:
      - '.github/workflows/verify-root-vercel.yml'
      - '.nvmrc'
      - 'api/**'
      - 'package.json'
      - 'scripts/smoke-production.mjs'
      - 'docs/native-package-record-v4.json'
      - 'vercel.json'
      - 'public/runtime-contract.js'
      - 'src/application-release-contract.js'
      - 'src/control-http.js'
      - 'src/worker.js'
      - 'src/nusd-http.js'
      - 'tests/treasury-simulation-http.test.mjs'
      - 'runtime/vercel-production/vercel.json'
      - 'runtime/vercel-production/api/**'
      - 'runtime/vercel-production/lib/**'
      - 'tests/provider-submitter.test.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Validate pinned Node runtime
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const nvmrc=readFileSync('.nvmrc','utf8').trim();
          if(pkg.engines?.node!=='24.x') throw new Error('package runtime must stay pinned to Node 24.x');
          if(nvmrc!=='24') throw new Error('.nvmrc must stay pinned to Node 24');
          if(Number(process.versions.node.split('.')[0])!==24) throw new Error('CI is not running Node 24');
          NODE
      - name: Validate governed Arc provider submitter
        run: node --test tests/provider-submitter.test.mjs
      - name: Validate NUSD simulation API
        run: node --test tests/treasury-simulation-http.test.mjs
      - name: Validate application build
        run: npm run build
      - name: Validate root routes, release identities and provenance-bound readiness
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {createRequire} from 'node:module';
          const config=JSON.parse(readFileSync('vercel.json','utf8'));
          if(config.git?.deploymentEnabled!==true) throw new Error('Git deployment policy must remain enabled in source');
          const rewrites=new Map((config.rewrites||[]).map(rule=>[rule.source,rule.destination]));
          for(const source of ['/v1/frontier/readiness','/v1/deployment/provenance','/v1/status','/v1/control/state','/v1/control/evaluate','/v1/execution/providers','/v1/execution/prepare','/v1/execution/submit','/v1/execution/evidence/bind','/v1/release/manifest','/v1/release/supply-chain','/v1/release/attestation','/v2/network/status','/v2/network/deployment-estimate','/v2/release/manifest','/v3/release/manifest','/v4/release/manifest']) if(!rewrites.has(source)) throw new Error('missing Vercel route: '+source);
          for(const configPath of ['vercel.json','runtime/vercel-production/vercel.json']) {
            const gateway=JSON.parse(readFileSync(configPath,'utf8'));
            const matches=(gateway.rewrites||[]).filter(rule=>rule.source==='/api/nusd/v1/:path*');
            if(matches.length!==1||matches[0].destination!=='https://numinalabs.xyz/api/nusd/v1/:path*') throw new Error('NUSD API must route once to the canonical service: '+configPath);
          }
          if(rewrites.get('/v1/frontier/readiness')!=='/api/application-release?mode=frontier-readiness') throw new Error('frontier readiness bypasses verifier');
          if(rewrites.get('/v1/deployment/provenance')!=='/api/application-release?mode=deployment-provenance') throw new Error('deployment provenance bypasses verifier');
          if(rewrites.get('/v1/execution/submit')!=='/api/execution-prepare?mode=submit') throw new Error('execution submit route bypasses governed handler');
          for(const source of ['/v2/release/manifest','/v3/release/manifest','/v4/release/manifest']) if(rewrites.get(source)!=='/api/application-release') throw new Error('application release alias bypasses validation proxy: '+source);
          const files=readdirSync('api').filter(name=>/\.(?:js|mjs)$/.test(name)).sort();
          if(files.length!==12) throw new Error('expected 12 root API adapters, found '+files.length);
          for(const file of files){const mod=await import(pathToFileURL(resolve('api',file)).href);if(typeof mod.default!=='function') throw new Error('default handler missing: '+file);}
          const {EXPECTED_RELEASE,RELEASE_ARTIFACT_TYPE}=await import(pathToFileURL(resolve('public/runtime-contract.js')).href);
          const {APPLICATION_VERSION,APPLICATION_RELEASE,EXPECTED_APPLICATION_ARTIFACT_BUILD_ID,APPLICATION_ARTIFACT_BUILD_SCOPE}=await import(pathToFileURL(resolve('src/application-release-contract.js')).href);
          const generatedApplication=JSON.parse(readFileSync('dist/client/downloads/application-release-v4.json','utf8'));
          if(generatedApplication.version!==APPLICATION_VERSION||generatedApplication.release!==APPLICATION_RELEASE) throw new Error('generated application release identity drift');
          if(generatedApplication.build_id!==EXPECTED_APPLICATION_ARTIFACT_BUILD_ID) throw new Error('generated application artifact inventory build id drift: '+generatedApplication.build_id);
          const require=createRequire(import.meta.url);
          const {RELEASE_IDENTITY}=require(resolve('runtime/vercel-production/lib/numina.js'));
          if(Object.keys(RELEASE_IDENTITY).length!==Object.keys(EXPECTED_RELEASE).length) throw new Error('runtime identity field set differs from pinned contract');
          for(const [field,expected] of Object.entries(EXPECTED_RELEASE)) if(RELEASE_IDENTITY[field]!==expected) throw new Error('runtime identity drift: '+field);
          if(JSON.stringify(RELEASE_IDENTITY).includes('rc22')) throw new Error('legacy rc22 identity survived runtime alignment');
          const {validateApplicationRelease,evaluateFrontierReadiness,validateDeploymentProvenance}=await import(pathToFileURL(resolve('api/application-release.mjs')).href);
          const application={schema:'numina.application-release.v2',schema_version:2,product:'Numina',version:APPLICATION_VERSION,release:APPLICATION_RELEASE,build_id:EXPECTED_APPLICATION_ARTIFACT_BUILD_ID,runtime_dependency:{version:EXPECTED_RELEASE.production_version,release:EXPECTED_RELEASE.release,manifest:'/v1/release/manifest',signed_declaration:'/v1/release/attestation'}};
          validateApplicationRelease(application);
          const deployment={schema:'numina.deployment-provenance.v1',environment:'production',deployment_id:'dpl_1234567890',deployment_url:'https://numina-production-example.vercel.app',git_commit_sha:'0123456789abcdef0123456789abcdef01234567',git_commit_ref:'main',runtime_release:EXPECTED_RELEASE.production_version,release:EXPECTED_RELEASE.release};
          if(!validateDeploymentProvenance(deployment)) throw new Error('valid deployment provenance rejected');
          const fundableTargets={schema:'numina.fundable-targets.v1',scope:'numina_native',target_display:'500T',target_amount:'500000000000000',target_scale:'trillion',target_count:500,status:'TARGET_BOUND',external_balance_verified:false,external_backing_asserted:false,external_funds_moved:false};
          const controlState={schema:'numina.control-state.v1',release:EXPECTED_RELEASE.production_version,controls:{runtime_controls_configurable:true,real_funds_enabled:true,employer_ip_enabled:false,public_execution_api_enabled:true,public_execution_route_exposed:true,execution_authorized:true,live_submission_enabled:true,provider_submitter_approved:true,live_provider_submitter_enabled:true,owner_authorization_required:true,pre_signed_payload_required:true,arbitrary_provider_url_allowed:false,embedded_private_key_allowed:false,fundable_targets:fundableTargets},funds_state:{schema:'numina.funds-state.v1',status:'ENABLED_BY_OWNER',real_funds_enabled:true,fundable_targets:fundableTargets,external_balance_verified:false,external_backing_asserted:false,external_funds_moved:false},execution_state:{schema:'numina.execution-state.v1',status:'GOVERNED_LIVE_SUBMISSION_ENABLED',execution_authorized:true,live_submission_enabled:true,provider_submitter_approved:true,public_execution_api_enabled:true,public_execution_route_exposed:true,live_provider_submitter_exposed:true,owner_authorization_required:true,pre_signed_payload_required:true,pre_signed_provider_submitter_available:true,credentialed_provider_submitter_available:false,external_execution_performed:false},partnership_state:{schema:'numina.partnership-state.v1',status:'NOT_ASSERTED',asserted:false,external_partnership_verified:false}};
          const manifest={schema:'numina.manifest.v1',source:'NUMINA',productionSource:'NUMINA',authority:'NUMINA',release:{...EXPECTED_RELEASE}};
          const supplyEvidence={valid:true,release:EXPECTED_RELEASE.release,production_files_root:EXPECTED_RELEASE.production_files_root,spdx_sbom_sha256:EXPECTED_RELEASE.spdx_sbom_sha256,slsa_provenance_sha256:EXPECTED_RELEASE.slsa_provenance_sha256};
          const records={application,manifest:{manifest,receipt:{artifact_type:'NUMINA_MANIFEST',payload:manifest}},attestation:{artifact_type:RELEASE_ARTIFACT_TYPE,payload:{...EXPECTED_RELEASE,environment:'production',role:'public-verifier'}},supply:{payload:{evidence:supplyEvidence,receipt:{artifact_type:'NUMINA_SUPPLY_CHAIN_EVIDENCE',payload:supplyEvidence}}},control:{state:controlState,receipt:{artifact_type:'NUMINA_CONTROL_STATE',payload:controlState}},deployment};
          const verifyEnvelope=(envelope,type)=>envelope?.artifact_type===type;
          const ready=evaluateFrontierReadiness(records,{verifyEnvelope});
          if(!ready.ready||!ready.checks.deployment_provenance_complete||!ready.checks.execution_authorization_bounded) throw new Error('owner-authorized provenance-bound rc26 state did not establish frontier readiness');
          if(ready.fundable_targets?.target_display!=='500T'||ready.fundable_targets?.scope!=='numina_native'||ready.fundable_targets?.external_balance_verified!==false||ready.fundable_targets?.external_backing_asserted!==false) throw new Error('500T Numina-native fundable target did not bind into readiness');
          if(ready.application.artifact_inventory_build_id!==EXPECTED_APPLICATION_ARTIFACT_BUILD_ID||ready.application.artifact_inventory_scope!==APPLICATION_ARTIFACT_BUILD_SCOPE) throw new Error('frontier readiness application artifact identity drift');
          const noProvenance=evaluateFrontierReadiness({...records,deployment:null},{verifyEnvelope});
          if(noProvenance.ready||noProvenance.checks.deployment_provenance_complete) throw new Error('frontier readiness did not fail closed without deployment provenance');
          const unsafeControl={...controlState,execution_state:{...controlState.execution_state,external_execution_performed:true}};
          const unsafe=evaluateFrontierReadiness({...records,control:{state:unsafeControl,receipt:{artifact_type:'NUMINA_CONTROL_STATE',payload:unsafeControl}}},{verifyEnvelope});
          if(unsafe.ready||unsafe.checks.execution_authorization_bounded) throw new Error('frontier readiness did not fail closed on unverified external execution state');
          const externalizedFunds={...controlState,funds_state:{...controlState.funds_state,external_balance_verified:true}};
          const externalized=evaluateFrontierReadiness({...records,control:{state:externalizedFunds,receipt:{artifact_type:'NUMINA_CONTROL_STATE',payload:externalizedFunds}}},{verifyEnvelope});
          if(externalized.ready||externalized.checks.execution_authorization_bounded) throw new Error('frontier readiness did not fail closed when 500T target was represented as verified external balance');
          console.log('Validated enabled Git deployment policy, pinned application artifact inventory '+EXPECTED_APPLICATION_ARTIFACT_BUILD_ID+', 12-function topology, exact rc26 identity, 500T Numina-native target, deployment provenance and owner-authorized pre-signed bounded execution readiness on Node '+process.versions.node+'.');
          NODE
