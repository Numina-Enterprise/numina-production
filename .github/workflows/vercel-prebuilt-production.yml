name: NUMINA prebuilt production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numina-production-prebuilt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_8bJOKLq941ouBmsFMEXAERfD
      VERCEL_PROJECT_ID: prj_WY1kKgo522ufsymotnArIUee01uO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Install source dependencies
        run: npm ci

      - name: Validate NUMINA
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build locally for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
