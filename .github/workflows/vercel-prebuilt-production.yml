name: NUMINA prebuilt production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: numina-production-prebuilt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_8bJOKLq941ouBmsFMEXAERfD
      VERCEL_PROJECT_ID: prj_WY1kKgo522ufsymotnArIUee01uO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require deployment credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            gh issue create --title "NUMINA prebuilt deploy blocked: VERCEL_TOKEN" --body "Commit: $GITHUB_SHA

The GitHub-hosted prebuilt deployment path is ready, but the repository does not expose a VERCEL_TOKEN secret to Actions. No deployment was attempted."
            exit 1
          fi

      - name: Install source dependencies
        run: npm ci

      - name: Validate NUMINA
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build locally for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Report successful bypass
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --title "NUMINA prebuilt deploy succeeded" --body "Commit: $GITHUB_SHA

Production deployment: $DEPLOY_URL

Build executed on GitHub-hosted compute and deployed as a Vercel prebuilt artifact."
