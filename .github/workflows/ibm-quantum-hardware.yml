name: IBM Quantum hardware validation

on:
  workflow_dispatch:
    inputs:
      shots:
        description: Number of shots for Bell-state validation
        required: true
        default: "256"
  push:
    paths:
      - ".github/ibm-quantum-hardware.trigger"

env:
  PYTHONUNBUFFERED: "1"
  IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY || secrets.IBM_QUANTUM_TOKEN || secrets.QISKIT_IBM_TOKEN || secrets.QISKIT_IBM_API_TOKEN || secrets.IBM_CLOUD_API_KEY || secrets.IBM_API_KEY || secrets.QISKIT_TOKEN || secrets.IBM_QUANTUM_KEY }}
  IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE || secrets.QISKIT_IBM_INSTANCE }}

jobs:
  hardware-validation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Diagnose IBM credential placement without values
        shell: bash
        env:
          HAS_SECRET_IBM_QUANTUM_API_KEY: ${{ secrets.IBM_QUANTUM_API_KEY != '' }}
          HAS_SECRET_IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN != '' }}
          HAS_SECRET_QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN != '' }}
          HAS_SECRET_QISKIT_IBM_API_TOKEN: ${{ secrets.QISKIT_IBM_API_TOKEN != '' }}
          HAS_SECRET_IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY != '' }}
          HAS_SECRET_IBM_API_KEY: ${{ secrets.IBM_API_KEY != '' }}
          HAS_SECRET_QISKIT_TOKEN: ${{ secrets.QISKIT_TOKEN != '' }}
          HAS_SECRET_IBM_QUANTUM_KEY: ${{ secrets.IBM_QUANTUM_KEY != '' }}
          HAS_VAR_IBM_QUANTUM_API_KEY: ${{ vars.IBM_QUANTUM_API_KEY != '' }}
          HAS_VAR_IBM_QUANTUM_TOKEN: ${{ vars.IBM_QUANTUM_TOKEN != '' }}
          HAS_VAR_QISKIT_IBM_TOKEN: ${{ vars.QISKIT_IBM_TOKEN != '' }}
          HAS_VAR_IBM_CLOUD_API_KEY: ${{ vars.IBM_CLOUD_API_KEY != '' }}
        run: |
          printf 'secret.IBM_QUANTUM_API_KEY=%s\n' "$HAS_SECRET_IBM_QUANTUM_API_KEY"
          printf 'secret.IBM_QUANTUM_TOKEN=%s\n' "$HAS_SECRET_IBM_QUANTUM_TOKEN"
          printf 'secret.QISKIT_IBM_TOKEN=%s\n' "$HAS_SECRET_QISKIT_IBM_TOKEN"
          printf 'secret.QISKIT_IBM_API_TOKEN=%s\n' "$HAS_SECRET_QISKIT_IBM_API_TOKEN"
          printf 'secret.IBM_CLOUD_API_KEY=%s\n' "$HAS_SECRET_IBM_CLOUD_API_KEY"
          printf 'secret.IBM_API_KEY=%s\n' "$HAS_SECRET_IBM_API_KEY"
          printf 'secret.QISKIT_TOKEN=%s\n' "$HAS_SECRET_QISKIT_TOKEN"
          printf 'secret.IBM_QUANTUM_KEY=%s\n' "$HAS_SECRET_IBM_QUANTUM_KEY"
          printf 'variable.IBM_QUANTUM_API_KEY=%s\n' "$HAS_VAR_IBM_QUANTUM_API_KEY"
          printf 'variable.IBM_QUANTUM_TOKEN=%s\n' "$HAS_VAR_IBM_QUANTUM_TOKEN"
          printf 'variable.QISKIT_IBM_TOKEN=%s\n' "$HAS_VAR_QISKIT_IBM_TOKEN"
          printf 'variable.IBM_CLOUD_API_KEY=%s\n' "$HAS_VAR_IBM_CLOUD_API_KEY"
      - name: Require IBM Quantum API key
        shell: bash
        run: |
          test -n "$IBM_QUANTUM_API_KEY" || { echo "No recognized IBM Quantum API-key repository secret is configured"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"
      - name: Install IBM Quantum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "qiskit~=2.5.2" "qiskit-ibm-runtime~=0.47.0"
      - name: Configure ephemeral IBM account
        run: |
          python - <<'PY'
          import os
          from qiskit_ibm_runtime import QiskitRuntimeService

          kwargs = {
              "channel": "ibm_quantum_platform",
              "token": os.environ["IBM_QUANTUM_API_KEY"],
              "overwrite": True,
              "set_as_default": True,
          }
          instance = os.environ.get("IBM_QUANTUM_INSTANCE", "").strip()
          if instance:
              kwargs["instance"] = instance
          QiskitRuntimeService.save_account(**kwargs)
          PY
      - name: Submit Bell-state workload to IBM QPU
        run: |
          python scripts/ibm-quantum-smoke.py \
            --submit \
            --wait \
            --shots "${{ inputs.shots || '256' }}" \
            --receipt release-evidence/ibm-quantum-hardware.json
      - name: Verify provider evidence boundary
        run: |
          python - <<'PY'
          import json
          p='release-evidence/ibm-quantum-hardware.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['mode']=='ibm-quantum-hardware'
          assert d['external_qpu_execution'] is True
          assert d.get('job_id')
          assert d.get('backend')
          assert d.get('final_status')
          assert d.get('counts')
          print('IBM job:', d['job_id'])
          print('Backend:', d['backend'])
          print('Counts:', d['counts'])
          PY
      - name: Upload credential-free IBM receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ibm-quantum-hardware-receipt
          path: release-evidence/ibm-quantum-hardware.json
          if-no-files-found: error
          retention-days: 90
