name: Verify Vercel deployment policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'vercel.json'
      - 'runtime/vercel-production/vercel.json'
      - '.github/workflows/verify-deployment-policy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Require main-only Git deployments
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const path of ['vercel.json','runtime/vercel-production/vercel.json']) {
            const config=JSON.parse(readFileSync(path,'utf8'));
            const policy=config.git?.deploymentEnabled;
            if(!policy||typeof policy!=='object'||policy['*']!==false||policy.main!==true||Object.keys(policy).sort().join(',')!=='*,main') {
              throw new Error(`${path} must disable all Git branches except main`);
            }
          }
          console.log('Validated main-only Git deployment policy in both Vercel configs.');
          NODE
