name: Deploy Numina to Cloudflare Edge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-edge:
    environment: Production
    name: Build and Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Install pinned dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Verify release pins and tests
        run: |
          node scripts/sync-application-release-pin.mjs
          git diff --exit-code -- src/application-release-contract.js
          npm test

      - name: Validate Cloudflare packaging
        run: npx --yes wrangler@4.102.0 deploy --dry-run

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NUMINA_CONTROL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: '3c1fd59ef2ef67f750b4bc23e656d722'
        run: npx --yes wrangler@4.102.0 deploy
