name: Deploy Numina to Cloudflare Edge

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'CLOUDFLARE_HARDENING_MANIFEST.yaml'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-edge:
    name: Build & Deploy to Cloudflare Worker Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Numina static assets & server distribution
        run: npm run build

      - name: Deploy to Cloudflare Workers with Assets
        uses: cloudflare/wrangler-action@392082e81ffab9ba1a029c85531a2067f565387b # v3.14.0
        with:
          apiToken: ${{ secrets.NUMINA_CONTROL_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3c1fd59ef2ef67f750b4bc23e656d722' }}
          command: deploy --dry-run=false
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.NUMINA_RPC_AUTHORIZATION }}

      - name: Purge Cloudflare Edge Cache for numinalabs.xyz
        if: success() && env.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NUMINA_CONTROL_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
