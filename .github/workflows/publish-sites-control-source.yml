name: Build and publish Numina
# Canonical frontier publication is the singular GitHub tree plus its validated package artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sites-control-source.yml'
      - '.openai/hosting.json'
      - 'config/numina-manifest.v2.json'
      - 'config/numina-routing.json'
      - 'config/numina-production-bound-state.v1.json'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'drizzle/**'
      - 'scripts/build.mjs'
      - 'scripts/release-manifest.mjs'
      - 'scripts/package.mjs'
      - 'scripts/publish-with-telemetry.mjs'
      - 'package.json'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: numina-singular-build
  cancel-in-progress: true

jobs:
  numina:
    name: numina
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Install pinned test dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund

      - name: Build Numina
        run: npm run build

      - name: Verify Numina before publication
        run: npm test

      - name: Package Numina
        run: node scripts/package.mjs "$RUNNER_TEMP/numina.tgz"

      - name: Restore exact committed source for publication
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Verify singular GitHub publication
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote https://github.com/skott34-dot/numina-production.git refs/heads/main | awk '{print $1}')"
          test -n "$remote_sha"
          test "$local_sha" = "$remote_sha"
          printf 'NUMINA source verified at %s\n' "$local_sha"

      - name: Upload validated NUMINA package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NUMINA-VALIDATED-PACKAGE
          path: ${{ runner.temp }}/numina.tgz
          if-no-files-found: error

      - name: Publish Numina Sites mirror
        continue-on-error: true
        shell: bash
        run: npm run publish:source -- sites

      - name: Upload Sites publishing telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NUMINA-SITES-PUBLISHING-TELEMETRY
          path: .openai/publishing/sites-*.json
          if-no-files-found: warn
