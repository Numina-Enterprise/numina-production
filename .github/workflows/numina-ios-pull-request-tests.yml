name: Numina iOS pull-request tests
on:
  pull_request:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/numina-ios-pull-request-tests.yml'
permissions:
  contents: read
concurrency:
  group: numina-ios-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcodebuild -version
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [
              device["udid"]
              for runtime, entries in devices.items()
              if "SimRuntime.iOS-" in runtime
              for device in entries
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(phones[0] if phones else "")
          ')"
          test -n "$DEVICE_ID"
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run native XCTest security and UI suites (unsigned)
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/numina-ios-pr-tests.log"
          RESULT="$RUNNER_TEMP/NuminaTests.xcresult"
          if ! xcodebuild -project mobile/ios/Numina.xcodeproj \
            -scheme Numina -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/NuminaDerived" \
            -parallel-testing-enabled NO -resultBundlePath "$RESULT" \
            CODE_SIGNING_ALLOWED=NO test > "$LOG" 2>&1; then
            tail -120 "$LOG"
            exit 1
          fi
          grep -E 'Test Case .* passed|Executed [0-9]+ tests|\\*\\* TEST SUCCEEDED \\*\\*' "$LOG" | tail -30
          xcrun xcresulttool get test-results summary --path "$RESULT"
