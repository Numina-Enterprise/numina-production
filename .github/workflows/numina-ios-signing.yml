name: Numina iOS distribution signing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numina-ios-distribution-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'skott34-dot/numina-production' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Sign the versioned iOS bundle with the configured Apple identity
        env:
          NUMINA_APPLE_TEAM_ID: ${{ vars.NUMINA_APPLE_TEAM_ID }}
          NUMINA_APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_BASE64 }}
          NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD }}
          NUMINA_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.NUMINA_APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/sign-ios-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numina-ios-signed
          path: packages/ios-signed/
          if-no-files-found: error
          retention-days: 90
