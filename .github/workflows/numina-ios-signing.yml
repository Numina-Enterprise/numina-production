name: Numina iOS distribution signing
on:
  push:
    branches: [main]
    paths:
      - 'release-evidence/native-signing-trigger-2026-09-20.json'
  workflow_dispatch:
    inputs:
      numina_authorization:
        description: 'Enter NUMINA to authorize production signing'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: numina-ios-distribution-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'skott34-dot/numina-production' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.numina_authorization == 'NUMINA')
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Verify NUMINA authorization
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.numina_authorization }}" = "NUMINA"
      - name: Verify one-time repository signing authorization
        if: github.event_name == 'push'
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('release-evidence/native-signing-trigger-2026-09-20.json','utf8'));if(x.schema!=='numina.native-signing-trigger.v1'||x.identity!=='NUMINA'||x.authorization!=='NUMINA'||x.oneTime!==true||x.rotateSigningIdentity!==false||x.storeSubmissionAuthorized!==false||x.signingIdentityPolicy!=='USE_EXISTING_CONFIGURED_IDENTITIES_ONLY')process.exit(1);"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile current NUMINA iOS source
        run: |
          xcodebuild -project mobile/ios/Numina.xcodeproj -scheme Numina -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/NuminaDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Sign current-source iOS bundle with configured Apple identity
        env:
          NUMINA_IOS_COMPILED_APP: ${{ runner.temp }}/NuminaDerived/Build/Products/Release-iphoneos/Numina.app
          NUMINA_APPLE_TEAM_ID: ${{ vars.NUMINA_APPLE_TEAM_ID }}
          NUMINA_APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_BASE64 }}
          NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD }}
          NUMINA_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.NUMINA_APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/sign-ios-release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: numina-ios-signed-final
          path: packages/ios-signed/
          if-no-files-found: error
          retention-days: 90
