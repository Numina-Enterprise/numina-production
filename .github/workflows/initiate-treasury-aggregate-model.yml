name: Probe live Numina treasury

on:
  workflow_dispatch:
  push:
    branches:
      - numina-treasury-live-probe-20261003
    paths:
      - '.github/workflows/initiate-treasury-aggregate-model.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: probe-live-numina-treasury
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      NUMINA_APPLICATION_ORIGIN: https://numinalabs.xyz
    steps:
      - name: Read current treasury execution fields with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          node --input-type=module <<'NODE'
          const endpoint=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience','numina-control');
          const oidcResponse=await fetch(endpoint,{
            headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
            signal:AbortSignal.timeout(15000)
          });
          const oidcText=await oidcResponse.text();
          if(!oidcResponse.ok)throw Error('OIDC token request failed HTTP '+oidcResponse.status);
          const oidc=JSON.parse(oidcText);
          if(typeof oidc.value!=='string'||oidc.value.split('.').length!==3)throw Error('invalid OIDC token');
          const origin=process.env.NUMINA_APPLICATION_ORIGIN;
          const response=await fetch(origin+'/api/control/v1/treasury',{
            redirect:'error',signal:AbortSignal.timeout(15000),
            headers:{Accept:'application/json',Authorization:'Bearer '+oidc.value}
          });
          const text=await response.text();
          if(!response.ok)throw Error('treasury read failed HTTP '+response.status+' '+text.slice(0,500));
          const t=JSON.parse(text);
          const requests=Array.isArray(t?.projection?.transaction_requests)?t.projection.transaction_requests.map(r=>({
            id:r.id??null,kind:r.kind??null,status:r.status??null,amount:r.amount??r.amount_minor??null,
            unit:r.unit??r.currency??null,network_reference:r.network_reference??null,
            destination_reference:r.destination_reference??null,source_wallet:r.source_wallet??null,
            source_address:r.source_address??null,bridge_address:r.bridge_address??r.bridge_contract??null,
            vault_address:r.vault_address??null,signer_address:r.signer_address??null,
            token_address:r.token_address??null,submission_performed:r.submission_performed??null,
            broadcast_performed:r.broadcast_performed??null,transaction_hash:r.transaction_hash??null
          })):[];

          const interesting={};
          const walk=(v,p='')=>{
            if(Array.isArray(v)){v.forEach((x,i)=>walk(x,p+'['+i+']'));return;}
            if(!v||typeof v!=='object')return;
            for(const [k,x] of Object.entries(v)){
              const q=p? p+'.'+k:k;
              if(/(?:address|wallet|signer|bridge|vault|network|destination|source|contract)/i.test(k) &&
                 (typeof x==='string'||typeof x==='number'||typeof x==='boolean'||x===null)){
                interesting[q]=x;
              }
              if(typeof x==='object'&&x!==null)walk(x,q);
            }
          };
          walk(t);
          const out={
            status:t.status??null,revision:t.revision??null,head:t.head??null,
            principal:t.principal??t.root??null,
            projection:{balance:t?.projection?.balance??null,unit:t?.projection?.unit??null},
            transaction_requests:requests,
            execution_fields:interesting
          };
          console.log('NUMINA_TREASURY_PROBE='+JSON.stringify(out));
          NODE
