name: Deploy NUSD contracts to NUMINA chain

on:
  push:
    branches: [main]
    paths:
      # Dependency-pin maintenance alone must not trigger an on-chain deployment.
      - 'runtime/nusd/scripts/deploy-production.mjs'
      - 'runtime/nusd/scripts/prepare-post-freeze-journal.mjs'
      - 'runtime/nusd/scripts/finalize-post-freeze-journal.mjs'
      - 'runtime/nusd/scripts/rpc-auth.mjs'
      - 'runtime/nusd/deployment.production.json'
      - 'runtime/nusd/artifacts/NuminaUSD.json'
      - 'runtime/nusd/artifacts/NuminaSettlement.json'
      - 'runtime/nusd/scripts/token-artifact.mjs'
      - 'runtime/nusd/contracts/**'
      - 'runtime/nusd/artifacts/**'
      - 'runtime/nusd/scripts/deploy-production.mjs'
      - 'runtime/nusd/scripts/validate-deployment.mjs'
      - 'runtime/nusd/deployment.production.json'
      - 'runtime/nusd/policies/issuer-policy-1500t-6d.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-nusd-contracts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      NUMINA_RPC_URL: https://u0yth28mgh-u0vtj8pzdz-rpc.us0-aws.kaleido.io/
      NUMINA_RPC_AUTHORIZATION: ${{ secrets.NUMINA_RPC_AUTHORIZATION }}
      NUMINA_CONTROL_API_KEY: ${{ secrets.NUMINA_CONTROL_API_KEY }}
      NUMINA_RPC_USERNAME: ${{ secrets.NUMINA_RPC_USERNAME }}
      NUMINA_RPC_PASSWORD: ${{ secrets.NUMINA_RPC_PASSWORD }}
      NUMINA_RPC_APP_USERNAME: ${{ secrets.NUMINA_RPC_APP_USERNAME }}
      NUMINA_RPC_APP_PASSWORD: ${{ secrets.NUMINA_RPC_APP_PASSWORD }}
      NUMINA_RPC_APP_CREDENTIAL: ${{ secrets.NUMINA_RPC_APP_CREDENTIAL }}
      NUMINA_KALEIDO_APP_CREDENTIAL: ${{ secrets.NUMINA_KALEIDO_APP_CREDENTIAL }}
      KALEIDO_APP_CREDENTIAL: ${{ secrets.KALEIDO_APP_CREDENTIAL }}
      KALEIDO_APP_CRED_USERNAME: ${{ secrets.KALEIDO_APP_CRED_USERNAME }}
      KALEIDO_APP_CRED_PASSWORD: ${{ secrets.KALEIDO_APP_CRED_PASSWORD }}
      KALEIDO_APP_USERNAME: ${{ secrets.KALEIDO_APP_USERNAME }}
      KALEIDO_APP_PASSWORD: ${{ secrets.KALEIDO_APP_PASSWORD }}
      KALEIDO_USERNAME: ${{ secrets.KALEIDO_USERNAME }}
      KALEIDO_PASSWORD: ${{ secrets.KALEIDO_PASSWORD }}
      NUMINA_KALEIDO_API_KEY: ${{ secrets.NUMINA_KALEIDO_API_KEY }}
      KALEIDO_API_KEY: ${{ secrets.KALEIDO_API_KEY }}
      NUMINA_EXPECTED_CHAIN_ID: '962421430'
      NUMINA_EXPECTED_GENESIS: '0xea95dac2ad854c835bc526d6be70a5a4614ccd47412a4bc710308b41010b53e1'
      NUMINA_SENDER: '0x1a45671AE2ee3E52264116151924FAAcb80Fc02E'
      NUMINA_APPLICATION_ORIGIN: https://numinalabs.xyz
      NUMINA_STRIPE_TREASURY_FINANCIAL_ACCOUNT: fa_65VNd6QL3zznqY5FOV916VNcN9EZSQiQliazWdBc8FkXMu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked NUSD runtime dependencies
        working-directory: runtime/nusd
        run: npm ci --ignore-scripts

      - name: Require production execution credentials
        shell: bash
        run: |
          if [ -z "$NUMINA_RPC_AUTHORIZATION$NUMINA_RPC_APP_CREDENTIAL$NUMINA_KALEIDO_APP_CREDENTIAL$KALEIDO_APP_CREDENTIAL$NUMINA_RPC_USERNAME$NUMINA_RPC_APP_USERNAME$KALEIDO_APP_CRED_USERNAME$KALEIDO_APP_USERNAME$KALEIDO_USERNAME$NUMINA_KALEIDO_API_KEY$KALEIDO_API_KEY" ]; then
            echo "No NUMINA/Kaleido credential source is configured."
            exit 2
          fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "GitHub OIDC token request variables are unavailable; no journal write or mint is attempted."
            exit 3
          fi

      - name: Prepare post-freeze journal mint and USDC deposit requests
        working-directory: runtime/nusd
        run: node scripts/prepare-post-freeze-journal.mjs artifacts/post-freeze-journal-plan.json

      - name: Validate exact 1,500T 6-decimal constructor
        working-directory: runtime/nusd
        run: node scripts/validate-deployment.mjs deployment.production.json --output artifacts/unsigned-production-deployment.json

      - name: Deploy NuminaUSD and NuminaSettlement
        working-directory: runtime/nusd
        run: node scripts/deploy-production.mjs deployment.production.json deployment-receipt.json

      - name: Bind verified 6-decimal mint receipt to NUMINA journal
        working-directory: runtime/nusd
        run: node scripts/finalize-post-freeze-journal.mjs artifacts/post-freeze-journal-plan.json deployment-receipt.json artifacts/post-freeze-journal-finalization.json

      - name: Upload verified NUMINA chain receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: NUSD-PRODUCTION-RECEIPT
          path: |
            runtime/nusd/deployment-receipt.json
            runtime/nusd/artifacts/unsigned-production-deployment.json
            runtime/nusd/artifacts/post-freeze-journal-plan.json
            runtime/nusd/artifacts/post-freeze-journal-finalization.json
          if-no-files-found: warn
