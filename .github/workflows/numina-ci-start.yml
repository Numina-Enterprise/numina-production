name: NUMINA CI start

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numina-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify runner and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.repository }}" == "skott34-dot/numina-production" ]]
          [[ "$(git rev-parse HEAD)" == "${{ github.sha }}" ]]
          node --version
      - name: Install pinned test dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: Build release artifacts
        run: npm run build
      - name: Run full regression
        run: npm test
