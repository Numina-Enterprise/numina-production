name: NUMINA Environment Dependency Export
on:
  push:
    branches: [numina-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout finalized NUMINA head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bfb7fcda12127a8444a9f5befe0607f02205dc8
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6bfb7fcda12127a8444a9f5befe0607f02205dc8"
          test -z "$(git status --porcelain)"
      - name: Install pinned NUMINA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: Archive environment dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz"             runtime/nusd/node_modules runtime/nusd/development/node_modules
          sha256sum "$RUNNER_TEMP/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz" >             "$RUNNER_TEMP/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz.sha256"
      - name: Upload environment dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NUMINA-NODE-MODULES-6bfb7fcda121
          path: |
            ${{ runner.temp }}/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz
            ${{ runner.temp }}/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
