name: NUMINA Environment Export
on:
  push:
    branches: [numina-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout finalized NUMINA head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bfb7fcda12127a8444a9f5befe0607f02205dc8
          fetch-depth: 1
          persist-credentials: false
      - name: Use finalized NUMINA Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify immutable source head and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6bfb7fcda12127a8444a9f5befe0607f02205dc8"
          test -z "$(git status --porcelain)"
          test "$(node -p 'process.versions.node')" = "24.21.0"
      - name: Install pinned NUMINA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: Archive environment state
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz"
          toolchain="$RUNNER_TEMP/NUMINA-NODE24-6bfb7fcda121.tar.gz"
          tar -czf "$deps" runtime/nusd/node_modules runtime/nusd/development/node_modules
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          test -x "$node_root/bin/node"
          tar -C "$node_root" -czf "$toolchain" bin/node bin/npm bin/npx lib/node_modules/npm
          sha256sum "$deps" > "$deps.sha256"
          sha256sum "$toolchain" > "$toolchain.sha256"
      - name: Upload environment state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NUMINA-ENV-6bfb7fcda121
          path: |
            ${{ runner.temp }}/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz
            ${{ runner.temp }}/NUMINA-NODE-MODULES-6bfb7fcda121.tar.gz.sha256
            ${{ runner.temp }}/NUMINA-NODE24-6bfb7fcda121.tar.gz
            ${{ runner.temp }}/NUMINA-NODE24-6bfb7fcda121.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
