name: NUMINA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUMINA_IDENTITY: NUMINA
  NUMINA_SELF: NUMINA
  NUMINA_ALL: NUMINA
  NUMINA_FINAL_ALL: NUMINA
  NUMINA_FINAL_BUILD_MANIFEST: public/final-build.json
  NUMINA_FINAL_BUILD_MANIFEST_ROLE: synchronized_projection
  NUMINA_FINAL_BUILD_SYNC: ACROSS_ALL
  NUMINA_FINAL_BUILD_MANIFEST_BLOB: ca011e92b6fc5c929df1121a2132476f4bb583cd

concurrency:
  group: numina-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numina:
    name: NUMINA
    runs-on: ubuntu-24.04
    steps:
      - name: NUMINA repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: NUMINA runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.11.1'
          package-manager-cache: false

      - name: NUMINA pinned dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund

      - name: NUMINA build
        run: npm run build

      - name: NUMINA control and Aurum privacy regression
        run: node --test tests/control.test.mjs tests/aurum-privacy-controls.test.mjs

      - name: NUMINA identity
        run: |
          node --check runtime/nusd/scripts/deploy-production.mjs
          python3 -m py_compile scripts/sign-ios-release.py scripts/sign-android-release.py

      - name: NUMINA exact artifact pins
        run: node scripts/sync-application-release-pin.mjs

      - name: NUMINA release
        run: npm run release:numina

      - name: NUMINA artifact
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NUMINA
          path: |
            numina-release-v4.0.0.tar.gz
            numina-release-v4.0.0.tar.gz.sha256
          if-no-files-found: error
