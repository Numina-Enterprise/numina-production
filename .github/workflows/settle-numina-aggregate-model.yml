name: Align singular Numina aggregate model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/settle-numina-aggregate-model.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: settle-numina-aggregate-model
  cancel-in-progress: false

jobs:
  settle:
    runs-on: NUMINA
    environment: production
    timeout-minutes: 5
    env:
      NUMINA_APPLICATION_ORIGIN: https://numinalabs.xyz
    steps:
      - name: Require GitHub OIDC production identity
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Commit singular 1500T Numina internal model alignment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin=process.env.NUMINA_APPLICATION_ORIGIN;
          async function githubIdToken(){
            const endpoint=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            endpoint.searchParams.set('audience','numina-control');
            const response=await fetch(endpoint,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},signal:AbortSignal.timeout(15000)});
            const text=await response.text();
            if(!response.ok)throw Error('GitHub OIDC token request failed: HTTP '+response.status+' '+text);
            const body=JSON.parse(text);
            if(typeof body.value!=='string'||body.value.split('.').length!==3)throw Error('GitHub OIDC token response invalid');
            return body.value;
          }
          const token=await githubIdToken();
          const eventId='treasury_aggregate_1500t_settlement_v1';

          function stable(value){
            if(value===null||typeof value==='boolean')return JSON.stringify(value);
            if(typeof value==='number'&&Number.isSafeInteger(value)&&!Object.is(value,-0))return String(value);
            if(typeof value==='string')return JSON.stringify(value);
            if(Array.isArray(value))return '['+value.map(stable).join(',')+']';
            if(value&&Object.getPrototypeOf(value)===Object.prototype)return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stable(value[k])).join(',')+'}';
            throw Error('INVALID_CANONICAL_VALUE');
          }
          async function request(path,options={}){
            const response=await fetch(origin+path,{redirect:'error',signal:AbortSignal.timeout(15000),...options,headers:{Accept:'application/json',Authorization:'Bearer '+token,...(options.headers||{})}});
            const text=await response.text();
            let body=null;try{body=JSON.parse(text);}catch{}
            if(!response.ok){const error=Error(`${options.method||'GET'} ${path} failed: HTTP ${response.status} ${text}`);error.status=response.status;throw error;}
            return body;
          }
          async function read(){return request('/api/control/v1/treasury');}
          async function write(body){return request('/api/control/v1/treasury',{method:'POST',headers:{'Content-Type':'application/json'},body:stable(body)});}

          let treasury=await read();
          if(treasury.status!=='READY'||treasury.projection?.unit!=='NUSD'||treasury.projection?.balance!=='500000000000000')throw Error('canonical Numina treasury must be READY at exactly 500T NUSD');

          const existing=treasury.projection.transaction_requests?.find(item=>item.id===eventId);
          if(existing){
            if(!['aggregate_settlement','aggregate_model_alignment'].includes(existing.kind)||existing.aggregate_amount!=='1500000000000000'||existing.components?.length!==3)throw Error('conflicting aggregate model record already exists');
            console.log(JSON.stringify({status:'ALREADY_RECORDED',revision:treasury.revision,head:treasury.head,alignment:existing,native_balance:treasury.projection.balance,external_settlement_verified:false},null,2));
            process.exit(0);
          }

          const event={
            id:eventId,
            expectedRevision:treasury.revision,
            expectedHead:treasury.head,
            Principal:treasury.root,
            Authority:'NUMINA',
            Objective:'treasury.aggregate.settle',
            Intent:{
              operation:'SETTLE_AGGREGATE_MODEL',
              aggregateAmount:'1500000000000000',
              bankAmount:'500000000000000',
              stripeAmount:'500000000000000',
              nativeAmount:'500000000000000',
              reason:'Owner-authorized singular NUMINA internal model alignment; bank and Stripe settlement remain separately provider-evidenced.'
            }
          };

          const result=await write(event);
          treasury=await read();
          const settlement=treasury.projection.transaction_requests?.find(item=>item.id===eventId);
          if(result?.status!=='FINAL'||!settlement||settlement.status!=='INTERNAL_MODELED_ALLOCATION'||settlement.aggregate_amount!=='1500000000000000'||treasury.projection.balance!=='500000000000000')throw Error('Numina aggregate model alignment readback failed');
          if(settlement.settlement_performed!==false||settlement.submission_performed!==false||settlement.external_provider_verification!==false||settlement.provider_settlement_evidence_bound!==false)throw Error('provider evidence boundary changed unexpectedly');
          console.log(JSON.stringify({status:'INTERNAL_MODELED_ALLOCATION',revision:treasury.revision,head:treasury.head,alignment:settlement,native_balance:treasury.projection.balance,burn_amount:'0',external_settlement_verified:false},null,2));
          NODE
