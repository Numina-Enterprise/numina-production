name: Verify root Numina

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-root-numina.yml'
      - '.github/workflows/numina.yml'
      - '.nvmrc'
      - 'api/**'
      - 'config/numina-routing.json'
      - 'package.json'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'runtime/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate pinned Node runtime
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const nvmrc=readFileSync('.nvmrc','utf8').trim();
          if(pkg.engines?.node!=='26.x') throw new Error('package runtime must stay pinned to Node 26.x');
          if(nvmrc!=='26.11.1') throw new Error('.nvmrc must stay pinned to Node 26.11.1');
          if(process.versions.node!=='26.11.1') throw new Error('CI is not running Node 26.11.1');
          NODE
      - name: Install pinned dependencies
        run: |
          npm ci --prefix runtime/nusd --ignore-scripts --no-audit --no-fund
          npm ci --prefix runtime/nusd/development --ignore-scripts --no-audit --no-fund
      - name: Validate provider-neutral Numina routing
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          const routing=JSON.parse(readFileSync('config/numina-routing.json','utf8'));
          if(routing.schema!=='numina.routing.v1'||routing.identity!=='NUMINA') throw new Error('Numina routing identity mismatch');
          if(routing.publicOrigin!=='https://numinalabs.xyz') throw new Error('Numina public origin mismatch');
          if(routing.canonicalSource?.identity!=='NUMINA'||routing.canonicalSource?.root!=='NUMINA'||routing.canonicalSource?.squareRoot!=='NUMINA'||routing.canonicalSource?.role!=='ROOT_SOURCE_OF_TRUTH'||routing.canonicalSource?.updateDirection!=='ROOT_TO_LEAVES') throw new Error('NUMINA must remain canonical root source');
          if(routing.tree?.root!=='NUMINA'||routing.tree?.squareRoot!=='NUMINA'||routing.tree?.sourceOfTruth!=='NUMINA'||routing.tree?.updateDirection!=='ROOT_TO_LEAVES') throw new Error('NUMINA tree root mismatch');
          if(routing.tree?.leaves?.github?.repository!=='skott34-dot/numina-production'||routing.tree?.leaves?.github?.branch!=='main'||routing.tree?.leaves?.github?.role!=='ARCHIVE_LEAF'||routing.tree?.leaves?.github?.authoritative!==false) throw new Error('GitHub leaf projection mismatch');
          const rewrites=new Map((routing.rewrites||[]).map(rule=>[rule.source,rule.destination]));
          for(const source of ['/readyz','/v1/bootstrap/attestation','/v1/frontier/readiness','/v1/deployment/provenance','/v1/status','/v1/control/state','/v1/control/evaluate','/v1/execution/providers','/v1/execution/prepare','/v1/execution/submit','/v1/execution/evidence/bind','/v1/release/manifest','/v1/release/supply-chain','/v1/release/attestation','/v2/release/manifest','/v3/release/manifest','/v4/release/manifest']) if(!rewrites.has(source)) throw new Error('missing Numina route: '+source);
          for(const retired of ['vercel.json','runtime/vercel-production/vercel.json','runtime/verifier-rc26/deploy/vercel/vercel.json']) if(existsSync(retired)) throw new Error('retired provider deployment config returned: '+retired);
          for(const path of ['src/numina-root.js','public/runtime-contract.js','integrations/numina/src/runtime-contract.js','api/application-release.mjs','api/execution-prepare.js','api/evidence-bind.js','scripts/package-rc27.py','scripts/source-alignment.mjs','scripts/prepare-ios-v4.py','mobile/signing/distribution-policy.json','public/publication-policy.json','public/final-build.json','config/numina-manifest.v2.json']){
            const text=readFileSync(path,'utf8');
            if(/numina-production\.vercel\.app|VERCEL_(?:PROJECT|DEPLOYMENT|TARGET|ENV|URL)/i.test(text)) throw new Error('active provider dependency returned: '+path);
          }
          NODE
      - name: Validate RC27 source package
        env:
          PYTHONPATH: runtime/verifier-rc27
        run: |
          python -m compileall -q runtime/verifier-rc27/numina runtime/verifier-rc27/numina_prod
          python scripts/package-rc27.py "$RUNNER_TEMP/numina-rc27-${GITHUB_RUN_ID}"
      - name: Validate application build
        run: npm run build
      - name: Validate exact distribution artifact pins
        run: node scripts/sync-application-release-pin.mjs
