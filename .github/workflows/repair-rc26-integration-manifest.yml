name: Repair rc26 integration manifest

on:
  push:
    paths:
      - '.github/workflows/repair-rc26-integration-manifest.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Align packaged runtime contract inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifestPath='integrations/numina/file-manifest.json';
          const sourcePath='integrations/numina/src/runtime-contract.js';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const bytes=fs.readFileSync(sourcePath);
          const entry=manifest.files.find(file=>file.path==='src/runtime-contract.js');
          if(!entry) throw new Error('runtime contract inventory entry missing');
          entry.bytes=bytes.length;
          entry.sha256=createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          console.log({bytes:entry.bytes,sha256:entry.sha256});
          NODE
      - name: Validate production build gate
        run: npm run build
      - name: Commit aligned inventory
        run: |
          git config user.name 'Numina Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add integrations/numina/file-manifest.json
          git diff --cached --check
          git commit -m 'Align packaged integration manifest with rc26 runtime contract'
          git push origin HEAD:main
