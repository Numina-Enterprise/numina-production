name: Numina iOS branch build
on:
  push:
    branches:
      - numina-site-treasury-alignment
permissions:
  contents: read
concurrency:
  group: numina-ios-branch-build
  cancel-in-progress: true
jobs:
  ios:
    runs-on: NUMINA
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile unsigned iOS release
        run: |
          xcodebuild -project mobile/ios/Numina.xcodeproj -scheme Numina -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/NuminaDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Verify built bundle metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/NuminaDerived/Build/Products/Release-iphoneos/Numina.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/NuminaDerived/Build/Products/Release-iphoneos/Numina.app/Info.plist"
