name: NUMINA native mobile store distribution
on:
  workflow_dispatch:
    inputs:
      numina_authorization:
        description: 'Enter NUMINA to authorize production store distribution'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: numina-native-mobile-store-distribution
  cancel-in-progress: false

jobs:
  android:
    if: inputs.numina_authorization == 'NUMINA'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Gradle
        run: |
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build current Android release
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --console=plain -p mobile/android :app:bundleRelease :app:assembleRelease
      - name: Sign current Android release
        env:
          NUMINA_RELEASE_SIGNING_VAULT: ${{ secrets.NUMINA_RELEASE_SIGNING_VAULT }}
        run: python3 scripts/sign-android-release.py
      - name: Install Google Play client
        run: >-
          python3 -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: google-auth==2.58.0 google-api-python-client==2.200.0
      - name: Submit Android release to Google Play
        env:
          NUMINA_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.NUMINA_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          NUMINA_GOOGLE_PLAY_TRACK: ${{ vars.NUMINA_GOOGLE_PLAY_TRACK || 'production' }}
          NUMINA_GOOGLE_PLAY_RELEASE_STATUS: ${{ vars.NUMINA_GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}
          NUMINA_GOOGLE_PLAY_RELEASE_NOTES: ${{ vars.NUMINA_GOOGLE_PLAY_RELEASE_NOTES || 'Numina 4.0.0' }}
        run: python3 scripts/submit-google-play.py
      - continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: numina-android-store-distribution
          path: packages/
          if-no-files-found: error
          retention-days: 90

  ios:
    if: inputs.numina_authorization == 'NUMINA'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile current iOS release
        run: |
          xcodebuild -version
          xcodebuild -project mobile/ios/Numina.xcodeproj -scheme Numina -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/NuminaDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Sign current iOS release
        env:
          NUMINA_IOS_COMPILED_APP: ${{ runner.temp }}/NuminaDerived/Build/Products/Release-iphoneos/Numina.app
          NUMINA_APPLE_TEAM_ID: ${{ vars.NUMINA_APPLE_TEAM_ID }}
          NUMINA_APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_BASE64 }}
          NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.NUMINA_APPLE_DISTRIBUTION_P12_PASSWORD }}
          NUMINA_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.NUMINA_APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/sign-ios-release.py
      - name: Upload signed iOS release to App Store Connect
        env:
          NUMINA_APP_STORE_CONNECT_KEY_ID: ${{ secrets.NUMINA_APP_STORE_CONNECT_KEY_ID }}
          NUMINA_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.NUMINA_APP_STORE_CONNECT_ISSUER_ID }}
          NUMINA_APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.NUMINA_APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: python3 scripts/submit-app-store.py
      - continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: numina-ios-store-distribution
          path: packages/ios-signed/
          if-no-files-found: error
          retention-days: 90
