name: Numina 5 strategy integrity
on:
  pull_request:
    paths:
      - 'docs/strategy/numina-5-multidimensional-roadmap.md'
      - 'ml/model-registry/numina-5-candidates.json'
      - '.github/workflows/numina-5-strategy-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate model registry and boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ml/model-registry/numina-5-candidates.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_id']=='numina.model-candidates.v1'
          assert d['canonical_identity']=='NUMINA'
          assert d['production_change_authorized'] is False
          assert d['treasury_change_authorized'] is False
          ids=[c['id'] for c in d['candidates']]
          assert len(ids)==len(set(ids)) and len(ids)>=4
          a=next(c for c in d['candidates'] if c['id']=='N5-CAND-A')
          assert a['submitted_score']==100
          assert a['submitted_score_type']=='provisional_self_assessment'
          assert a['verified_score'] is None
          assert a['admission']=='HOLD'
          for c in d['candidates']:
              assert c['admission'] in ('HOLD','NOT_RUN','INCONCLUSIVE','FAIL','PASS')
          doc=Path('docs/strategy/numina-5-multidimensional-roadmap.md').read_text(encoding='utf-8')
          for phrase in ('SK Consulting LLC dba Numina Labs','superintelligence is aspirational','No production deployment'):
              assert phrase.lower() in doc.lower(), phrase
          print('PASS: strategy registry structural checks')
          PY
