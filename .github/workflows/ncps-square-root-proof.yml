name: NCPS square-root proof

on:
  pull_request:
    paths:
      - 'release-evidence/ncps-square-root-2026-10-11/**'
      - '.github/workflows/ncps-square-root-proof.yml'
  push:
    branches:
      - ncps-square-root-fix-2026-10-11
    paths:
      - 'release-evidence/ncps-square-root-2026-10-11/**'
      - '.github/workflows/ncps-square-root-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Numina source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Checkout pinned Mathlib v4.22.0
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          git -C /tmp/mathlib4 checkout --detach 79e94a093aff4a60fb1b1f92d9681e407124c2ca
          test "$(git -C /tmp/mathlib4 rev-parse HEAD)" = "79e94a093aff4a60fb1b1f92d9681e407124c2ca"

      - name: Install the pinned Lean toolchain
        working-directory: /tmp/mathlib4
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- --default-toolchain none -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version

      - name: Restore Mathlib cache
        working-directory: /tmp/mathlib4
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" exe cache get

      - name: Kernel-check NCPS square-root successor
        working-directory: /tmp/mathlib4
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/release-evidence/ncps-square-root-2026-10-11/NCPSSquareRoot.lean" ./NCPSSquareRoot.lean
          "$HOME/.elan/bin/lake" env lean -t 0 NCPSSquareRoot.lean
