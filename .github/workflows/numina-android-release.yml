name: Numina signed Android production release
on:
  push:
    branches: [main]
    paths:
      - 'release-evidence/native-signing-trigger-2026-09-20.json'
  workflow_dispatch:
    inputs:
      numina_authorization:
        description: 'Enter NUMINA to authorize production signing'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: numina-android-signing
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'skott34-dot/numina-production' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.numina_authorization == 'NUMINA')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify NUMINA authorization
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ inputs.numina_authorization }}" = "NUMINA"
      - name: Verify one-time repository signing authorization
        if: github.event_name == 'push'
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('release-evidence/native-signing-trigger-2026-09-20.json','utf8'));if(x.schema!=='numina.native-signing-trigger.v1'||x.identity!=='NUMINA'||x.authorization!=='NUMINA'||x.oneTime!==true||x.rotateSigningIdentity!==false||x.storeSubmissionAuthorized!==false||x.signingIdentityPolicy!=='USE_EXISTING_CONFIGURED_IDENTITIES_ONLY')process.exit(1);"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Gradle
        run: |
          curl --fail --location --retry 2 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Compile release packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --console=plain -p mobile/android :app:bundleRelease :app:assembleRelease
      - name: Sign and verify the production packages
        env:
          NUMINA_RELEASE_SIGNING_VAULT: ${{ secrets.NUMINA_RELEASE_SIGNING_VAULT }}
        run: python3 scripts/sign-android-release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: numina-android-signed-final
          path: packages/
          if-no-files-found: error
          retention-days: 90
