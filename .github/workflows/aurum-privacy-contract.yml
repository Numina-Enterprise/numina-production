name: Aurum privacy boundary contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aurum-privacy-contract.yml'
      - 'tests/aurum-privacy-controls.test.mjs'
      - 'src/control.js'
      - 'src/control-store.js'
      - 'scripts/sqlite.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-boundary:
    name: Offline privacy boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Node 26 runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.11.1'
          package-manager-cache: false
      - name: Run synthetic privacy-boundary tests
        run: node --test tests/aurum-privacy-controls.test.mjs
