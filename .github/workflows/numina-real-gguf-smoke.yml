name: Numina real GGUF smoke (manual, non-release)
on:
  workflow_dispatch:
    inputs:
      llama_cpp_commit:
        description: 'Reviewed 40-character llama.cpp commit SHA'
        required: true
        type: string
      license_reviewed:
        description: 'Confirm model license reviewed for this non-production test'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  real-gguf:
    if: ${{ inputs.license_reviewed }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate reviewed llama.cpp commit
        env:
          COMMIT: ${{ inputs.llama_cpp_commit }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Build reviewed llama.cpp source
        env:
          COMMIT: ${{ inputs.llama_cpp_commit }}
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout --detach "$COMMIT"
          cmake -S /tmp/llama.cpp -B /tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-build --target llama-cli -j 2
      - name: Download SHA-pinned real GGUF checkpoint
        run: |
          curl --fail --location --retry 3 --output /tmp/stories260K.gguf 'https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories260K.gguf'
          echo '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  /tmp/stories260K.gguf' | sha256sum -c -
      - name: Execute real generation and preserve unpromoted evidence
        run: |
          python3 ml/inference/accept_real_gguf.py \
            --cli /tmp/llama-build/bin/llama-cli \
            --model /tmp/stories260K.gguf \
            --model-sha256 047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b \
            --prompt 'Once upon a time' --max-tokens 32 \
            --output /tmp/real-inference-receipt.json
          python3 -c 'import json; r=json.load(open("/tmp/real-inference-receipt.json")); assert r["status"]=="GENERATED_UNEVALUATED" and r["response"].strip()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-gguf-unreviewed-inference-receipt
          path: /tmp/real-inference-receipt.json
          retention-days: 7
