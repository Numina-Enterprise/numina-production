name: Observe NUSD Current State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nusd-production.yml'
      - 'runtime/nusd/scripts/verify-production.mjs'
      - 'runtime/nusd/scripts/observe-current.mjs'
      - 'runtime/nusd/scripts/rpc-auth.mjs'
  workflow_run:
    workflows: ['Deploy NUSD contracts to NUMINA chain']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      NUMINA_RPC_URL: https://u0yth28mgh-u0vtj8pzdz-rpc.us0-aws.kaleido.io/
      NUMINA_RPC_AUTHORIZATION: ${{ secrets.NUMINA_RPC_AUTHORIZATION }}
      NUMINA_RPC_USERNAME: ${{ secrets.NUMINA_RPC_USERNAME }}
      NUMINA_RPC_PASSWORD: ${{ secrets.NUMINA_RPC_PASSWORD }}
      NUMINA_RPC_APP_USERNAME: ${{ secrets.NUMINA_RPC_APP_USERNAME }}
      NUMINA_RPC_APP_PASSWORD: ${{ secrets.NUMINA_RPC_APP_PASSWORD }}
      NUMINA_RPC_APP_CREDENTIAL: ${{ secrets.NUMINA_RPC_APP_CREDENTIAL }}
      NUMINA_KALEIDO_APP_CREDENTIAL: ${{ secrets.NUMINA_KALEIDO_APP_CREDENTIAL }}
      KALEIDO_APP_CREDENTIAL: ${{ secrets.KALEIDO_APP_CREDENTIAL }}
      KALEIDO_APP_CRED_USERNAME: ${{ secrets.KALEIDO_APP_CRED_USERNAME }}
      KALEIDO_APP_CRED_PASSWORD: ${{ secrets.KALEIDO_APP_CRED_PASSWORD }}
      KALEIDO_APP_USERNAME: ${{ secrets.KALEIDO_APP_USERNAME }}
      KALEIDO_APP_PASSWORD: ${{ secrets.KALEIDO_APP_PASSWORD }}
      KALEIDO_USERNAME: ${{ secrets.KALEIDO_USERNAME }}
      KALEIDO_PASSWORD: ${{ secrets.KALEIDO_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install locked NUSD runtime dependencies
        working-directory: runtime/nusd
        run: npm ci --ignore-scripts
      - name: Check read-only observation boundaries
        run: node --test tests/nusd-current-observation.test.mjs
      - name: Observe current state without changing chain or historical receipts
        working-directory: runtime/nusd
        run: node scripts/verify-production.mjs > "$RUNNER_TEMP/nusd-current-observation.json"
      - name: Retain observation or access blocker
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NUSD-CURRENT-OBSERVATION
          path: ${{ runner.temp }}/nusd-current-observation.json
          if-no-files-found: error
