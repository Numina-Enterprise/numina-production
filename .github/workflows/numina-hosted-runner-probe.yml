name: NUMINA hosted runner probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/numina-hosted-runner-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner allocation
        run: echo NUMINA_HOSTED_RUNNER_READY
