name: Numina Private Agent Lab Validation
on:
  pull_request:
    paths:
      - 'config/numina-agent-training-lab.v1.json'
      - 'config/numina-agent-capital.v1.json'
      - 'config/numina-control-room-teams.v1.json'
      - 'src/training-lab/**'
      - 'tests/numina-training-lab.test.mjs'
      - '.github/workflows/private-agent-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-offline-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Validate registry and treasury boundaries
        run: node --test tests/numina-training-lab.test.mjs
      - name: Run deterministic 15-room sandbox exercise
        run: |
          node src/training-lab/run-training-cycle.mjs dungeons 17 > training-run.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('training-run.json','utf8'));if(r.room_count!==15||r.completed!==15||r.real_money_transfers!==0||r.is_live_game_control!==false||r.is_real_model_inference!==false)process.exit(1);console.log('Simulation exercise: 15/15 rooms, no external controls or real funds');"
      - name: Upload simulated receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: numina-private-training-run
          path: training-run.json
          retention-days: 7
