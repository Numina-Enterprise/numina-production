name: Numina NUSD runtime image and provenance
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: numina-nusd-runtime-build
  cancel-in-progress: false
jobs:
  build-and-attest:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/numina-nusd-runtime-builder.yml
    # No inputs or inherited secrets. This builds artifacts, never a transaction.
