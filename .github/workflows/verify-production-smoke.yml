name: Verify production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/verify-production-smoke.yml'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/smoke-production.mjs'
      - 'public/runtime-contract.js'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: verify-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify live production identity and signed readiness
        run: npm run smoke:production
