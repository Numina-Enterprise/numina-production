name: IBM Quantum smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ibm-quantum-smoke.py"
      - ".github/workflows/ibm-quantum-smoke.yml"

permissions:
  contents: read

jobs:
  local-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Qiskit
        run: python -m pip install "qiskit~=2.5.2"
      - name: Run local Bell-state validation
        run: |
          python scripts/ibm-quantum-smoke.py \
            --shots 256 \
            --receipt ibm-quantum-local.json
      - name: Verify receipt boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("ibm-quantum-local.json").read_text())
          assert r["schema"] == "numina.ibm-quantum-smoke.v1"
          assert r["mode"] == "local-simulation"
          assert r["external_qpu_execution"] is False
          assert r["shots"] == 256
          assert sum(r["counts"].values()) == 256
          unexpected = set(r["counts"]) - {"00", "11"}
          assert not unexpected, f"unexpected Bell outcomes: {unexpected}"
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ibm-quantum-local-smoke
          path: ibm-quantum-local.json
          if-no-files-found: error
