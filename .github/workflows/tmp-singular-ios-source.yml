name: Temporary singular iOS source alignment
on:
  push:
    branches: [build/ios-source-singular-20260920]
    paths:
      - '.github/workflows/tmp-singular-ios-source.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: build/ios-source-singular-20260920
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Package current iOS source
        run: python3 scripts/package-ios-source.py
      - name: Commit generated source package
        run: |
          git config user.name "NUMINA"
          git config user.email "actions@users.noreply.github.com"
          git add docs/native-package-record-v4.json docs/numina-os-4.0.0-ios-source.zip
          if [ -d runtime/vercel-production/public/downloads ]; then
            git add runtime/vercel-production/public/downloads/native-package-record-v4.json runtime/vercel-production/public/downloads/numina-os-4.0.0-ios-source.zip || true
          fi
          git commit -m "Regenerate singular NUMINA iOS source package"
          git push origin HEAD:build/ios-source-singular-20260920
