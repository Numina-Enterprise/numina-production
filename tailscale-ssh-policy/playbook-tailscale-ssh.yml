---
# ==============================================================================
# playbook-tailscale-ssh.yml
# Ansible Playbook to enforce Tailscale SSH and firewall hardening on target hosts
# ==============================================================================

- name: Enforce Tailscale SSH and Zero-Trust Host Hardening
  hosts: all
  become: true
  vars:
    tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTHKEY') | default('', true) }}"
    tailscale_tags: "tag:server"
    tailscale_ssh_enabled: true
    tailscale_accept_routes: false
    tailscale_enable_ufw: true
    tailscale_install: false
    tailscale_install_url: "https://tailscale.com/install.sh"
    tailscale_install_sha256: ""

  pre_tasks:
    - name: Refuse unpinned automatic Tailscale installation
      ansible.builtin.assert:
        that:
          - not tailscale_install | bool or tailscale_install_sha256 | length > 0
        fail_msg: >-
          Set tailscale_install_sha256 to a reviewed SHA-256 before enabling
          automatic installation.

    - name: Require the firewall hardening path
      ansible.builtin.assert:
        that:
          - tailscale_enable_ufw | bool
        fail_msg: >-
          tailscale_enable_ufw must remain true for this hardening playbook.
          Confirm out-of-band console access before running it remotely.

  tasks:
    - name: Ensure curl and gpg are installed
      ansible.builtin.package:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    - name: Check if Tailscale binary is installed
      ansible.builtin.command: which tailscale
      register: tailscale_check
      failed_when: false
      changed_when: false

    - name: Install Tailscale from a pinned installer when explicitly enabled
      block:
        - name: Download the reviewed Tailscale installer
          ansible.builtin.get_url:
            url: "{{ tailscale_install_url }}"
            dest: /tmp/tailscale-install.sh
            mode: "0700"
            checksum: "sha256:{{ tailscale_install_sha256 }}"
        - name: Run the reviewed Tailscale installer
          ansible.builtin.command: /tmp/tailscale-install.sh
      always:
        - name: Remove any leftover installer
          ansible.builtin.file:
            path: /tmp/tailscale-install.sh
            state: absent
      when:
        - tailscale_check.rc != 0
        - tailscale_install | bool

    - name: Refuse to continue when Tailscale is missing
      ansible.builtin.assert:
        that:
          - tailscale_check.rc == 0 or tailscale_install | bool
        fail_msg: >-
          Install Tailscale separately or set tailscale_install=true with a
          reviewed SHA-256 checksum.

    - name: Ensure tailscaled service is enabled and started
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Check current Tailscale status
      ansible.builtin.command: tailscale status
      register: tailscale_status
      failed_when: false
      changed_when: false

    - name: Require an auth key for non-interactive enrollment
      ansible.builtin.assert:
        that:
          - tailscale_status.rc == 0 or tailscale_auth_key | length > 0
        fail_msg: TAILSCALE_AUTHKEY is required when the node is not enrolled.

    - name: Authenticate and register a new Tailscale node
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--authkey={{ tailscale_auth_key }}"
          - --ssh
          - "--advertise-tags={{ tailscale_tags }}"
          - "--accept-routes={{ tailscale_accept_routes | bool | ternary('true', 'false') }}"
      when:
        - tailscale_status.rc != 0
        - tailscale_auth_key | length > 0
      no_log: true

    - name: Enable Tailscale SSH on existing node
      ansible.builtin.command: tailscale set --ssh=true
      when:
        - tailscale_status.rc == 0
        - tailscale_ssh_enabled | bool

    # The Ansible UFW collection module is intentionally quarantined. Use explicit
    # ufw commands so activation and deny-by-default behavior remain auditable.
    - name: Remove generic public OpenSSH UFW rule if present
      ansible.builtin.command:
        argv: [ufw, delete, allow, OpenSSH]
      register: ufw_delete_openssh
      failed_when: false
      changed_when: ufw_delete_openssh.rc == 0

    - name: Remove direct port 22 UFW rule if present
      ansible.builtin.command:
        argv: [ufw, delete, allow, 22/tcp]
      register: ufw_delete_public_ssh
      failed_when: false
      changed_when: ufw_delete_public_ssh.rc == 0

    - name: Remove any legacy TCP 22 allow rule on tailscale0
      ansible.builtin.command:
        argv: [ufw, delete, allow, in, on, tailscale0, to, any, port, '22', proto, tcp]
      register: ufw_delete_tailscale_ssh
      failed_when: false
      changed_when: ufw_delete_tailscale_ssh.rc == 0

    - name: Set UFW default incoming policy to deny
      ansible.builtin.command: ufw default deny incoming

    - name: Set UFW default outgoing policy to allow
      ansible.builtin.command: ufw default allow outgoing

    - name: Activate UFW with the deny-by-default policy
      ansible.builtin.command: ufw --force enable

    - name: Reload UFW
      ansible.builtin.command: ufw reload

    - name: Verify Tailscale SSH status
      ansible.builtin.shell: tailscale status --json | grep -i '"ssh": true'
      register: verify_ssh
      changed_when: false

    - name: Clear the auth-key variable from Ansible facts
      ansible.builtin.set_fact:
        tailscale_auth_key: ""
      no_log: true

    - name: Output status report
      ansible.builtin.debug:
        msg: "Tailscale SSH successfully verified and active on {{ inventory_hostname }}."
