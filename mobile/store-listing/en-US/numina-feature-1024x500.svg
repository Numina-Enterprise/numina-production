<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">Numina — Intelligence in Motion.</title>
  <desc id="desc">Numina's cyan block N surrounded by fine cyan and violet orbital lines on a dark background. Service work. Connected workflows.</desc>
  <defs>
    <radialGradient id="ambient" cx="78%" cy="50%" r="52%">
      <stop offset="0" stop-color="#20383b" stop-opacity=".50"/>
      <stop offset=".57" stop-color="#172028" stop-opacity=".32"/>
      <stop offset="1" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7de8ed"/>
      <stop offset="1" stop-color="#a69dff"/>
    </linearGradient>
    <linearGradient id="lowerLine">
      <stop stop-color="#7de8ed" stop-opacity=".6"/>
      <stop offset="1" stop-color="#7de8ed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="#07080c"/>
  <rect width="1024" height="500" fill="url(#ambient)"/>

  <!-- Wordmark and editable live typography. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="140" fill="#eef4f6" font-size="29" font-weight="700" letter-spacing="6.2">NUMINA</text>
    <text x="67" y="224" fill="#f2f5f8" font-size="49" font-weight="400" letter-spacing="-1.7">Intelligence</text>
    <text x="67" y="281" fill="#7de8ed" font-size="49" font-weight="400" letter-spacing="-1.7">in Motion.</text>
    <text x="70" y="338" fill="#b5bdcb" font-size="18" letter-spacing=".1">Service work. Connected workflows.</text>
  </g>
  <path d="M70 370H424" stroke="url(#lowerLine)" stroke-width="1"/>

  <!-- Orbit geometry extends the current website's native SVG motif. -->
  <g fill="none" stroke="#91b1c1" stroke-opacity=".16" stroke-width="1">
    <circle cx="795" cy="250" r="137"/>
    <circle cx="795" cy="250" r="181"/>
    <circle cx="795" cy="250" r="225"/>
  </g>
  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <path d="M795 25A225 225 0 0 1 1012.33 191.77" stroke-width="1.7" stroke-opacity=".8"/>
    <path d="M623.67 308.44A181 181 0 0 1 701.77 94.78" stroke-width="1.5" stroke-opacity=".72"/>
    <path d="M923.74 296.86A137 137 0 0 1 748.14 378.74" stroke-width="1.8" stroke-opacity=".95"/>
  </g>
  <g>
    <circle cx="795" cy="25" r="3.5" fill="#7de8ed"/>
    <circle cx="623.67" cy="308.44" r="3" fill="#7de8ed"/>
    <circle cx="923.74" cy="296.86" r="3" fill="#a69dff"/>
  </g>

  <!-- Polygon reproduces the current PNG icon's solid block N identity. -->
  <path d="M136 136H185L328 314V136H377V377H328L185 200V377H136Z"
        transform="translate(614.2 69.2) scale(.705)" fill="#7de8ed"/>
</svg>
