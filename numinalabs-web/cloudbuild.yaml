steps:
  # Build container image targeting modern Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/project-0317d6c9-e943-409e-83f/numina-production/numinalabs-web:latest', '.']

  # Push container image to existing numina-production repository
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/project-0317d6c9-e943-409e-83f/numina-production/numinalabs-web:latest']

  # Deploy to Cloud Run in us-central1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'numinalabs-web'
      - '--image'
      - 'us-central1-docker.pkg.dev/project-0317d6c9-e943-409e-83f/numina-production/numinalabs-web:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - 'project-0317d6c9-e943-409e-83f'

images:
  - 'us-central1-docker.pkg.dev/project-0317d6c9-e943-409e-83f/numina-production/numinalabs-web:latest'
