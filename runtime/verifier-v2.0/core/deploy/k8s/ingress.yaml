apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: numina-public
  namespace: numina
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts: [www.numinalabs.xyz]
    secretName: numina-public-tls
  rules:
  - host: www.numinalabs.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: numina-verifier
            port: {name: http}
