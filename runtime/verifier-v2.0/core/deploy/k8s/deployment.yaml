apiVersion: apps/v1
kind: Deployment
metadata: {name: numina-verifier, namespace: numina}
spec:
  replicas: 3
  selector: {matchLabels: {app: numina-verifier}}
  template:
    metadata: {labels: {app: numina-verifier}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: verifier
        image: ghcr.io/REPLACE_WITH_OWNER/numina-verifier@sha256:REPLACE_WITH_DIGEST
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080, name: http}]
        envFrom: [{configMapRef: {name: numina-verifier}}]
        env:
        - name: NUMINA_SIGNING_KEY_FILE
          value: /var/run/numina-keys/release.pem
        volumeMounts:
        - {name: release-key, mountPath: /var/run/numina-keys, readOnly: true}
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
      volumes:
      - name: release-key
        secret: {secretName: numina-release-signing-key, defaultMode: 256}
---
apiVersion: v1
kind: Service
metadata: {name: numina-verifier, namespace: numina}
spec:
  selector: {app: numina-verifier}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: numina-verifier, namespace: numina}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: numina-verifier}}
