apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: numina-authority-node-default-deny
  namespace: numina
spec:
  podSelector: {matchLabels: {app: numina-authority-node}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: numina-verifier}}
    ports: [{protocol: TCP, port: 8080}]
  egress:
  - ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
# Intentionally no PostgreSQL egress here. Production deployment must add an
# environment-specific NetworkPolicy permitting only the approved database endpoint.
